<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Watch Sync</title>
</head>
<body>
    <div id="WatchSyncConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
        <div data-role="content">
            <div class="content-primary">
                <p id="WatchSyncNoSettings">
                    Watch Sync has no settings yet. Nothing on this page changes what the plugin
                    does, so nothing on this page is offered.
                </p>
            </div>
        </div>
        <script type="text/javascript">
            var WatchSyncConfig = {
                pluginUniqueId: 'aa15847e-2417-4fa7-889c-4c1960d2efec'
            };

            document.querySelector('#WatchSyncConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    // Asks the server for this plugin's configuration and does nothing with the
                    // answer. The call stays because it is what proves the page is bound to this
                    // plugin rather than to nothing: a wrong identifier fails here, visibly, and
                    // not silently the first time a setting exists to be read.
                    ApiClient.getPluginConfiguration(WatchSyncConfig.pluginUniqueId).then(function () {
                        Dashboard.hideLoadingMsg();
                    });
                });
        </script>
    </div>
</body>
</html>
