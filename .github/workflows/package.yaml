# Builds the package a release would ship, on every pull request, and publishes
# the component inventory of what went into it.
#
# The inventory is also judged here rather than only recorded: a component under a
# licence this repository may not distribute under its own is refused at build
# time by .github/check-component-licences.py, which is #118's third condition.
#
# The inventory is the part nothing produced before. Packaging itself already ran
# on a pull request: the shared workflow build.yaml calls runs the same packager,
# which is a third call site rather than a second one, and it is why this file
# does not claim to be the first thing that packages here.
#
# This is a further invocation of the packager rather than a second packaging
# route: the same action at the same commit the release route resolves to, with
# the framework build.yaml declares. PackagingGateTests refuses the call sites
# drifting apart, so moving one pin without the other reddens the suite instead
# of leaving one route packaging bytes another never built.
#
# It packages both server lines, one archive and one inventory each. The packager
# stamps the archive with the top level targetAbi of the manifest standing at
# build.yaml rather than with the framework it was told to build, so a second call
# with a second framework and the same manifest would produce an archive claiming
# the line it cannot run on. What makes two lines possible here is a manifest per
# line, which #375 landed: the second call is preceded by the same swap the release
# route makes for a tagged line, read back before the packager sees it.
#
# The two archives are named alike, because the manifests agree on the plugin's name
# and version and ReleaseLineTests refuses them disagreeing on either. So the first
# is moved under its own line before the second call rather than after it, and a run
# that packaged one archive over the other would be a run reporting two packages and
# holding one.
name: package

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny at the workflow level and grant on the job, so what this runs with is
# written here rather than inherited from the repository's default workflow
# permission, which is a repository setting no file in this tree can pin.
permissions: {}

# Cancel a superseded run on the same ref. Packaging reads the checkout and
# depends on nothing a cancelled run leaves behind.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # The check context comes from this name, so renaming the job removes it from
    # wherever it is relied on. Change it deliberately or not at all.
    name: Package and inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Checkout and restore only. The inventory is attached to the run by the
      # run token and nothing here writes to the repository.
      contents: read
    steps:
      - name: Check out the commit under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so do not leave the token in .git/config.
          persist-credentials: false

      - name: Set up .NET
        # Both SDKs. The plugin declares both server lines in one project, so a
        # restore that evaluates it needs both, and the inventory below is read
        # off that restore rather than off the one line this run packages.
        #
        # No dependency cache. A cache entry written by another run must never be
        # able to reach the graph the inventory then describes as the truth.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore against the committed lock file
        # The packager calls dotnet itself and passes no restore arguments, so
        # without this the graph it compiles from is whatever the feed served at
        # that minute. Locked mode refuses a graph that does not match
        # packages.lock.json, which is the file review actually saw, and it is
        # also what the inventory below reads.
        run: |
          set -euo pipefail
          project="Jellyfin.Plugin.WatchSync/Jellyfin.Plugin.WatchSync.csproj"
          lock="$(dirname "${project}")/packages.lock.json"
          if [ ! -f "${lock}" ]; then
            echo "::error::${lock} does not exist. This run restores in locked mode so the packaged bytes and the inventory come from the dependency graph that was reviewed. Run: dotnet restore ${project} -p:RestorePackagesWithLockFile=true, then commit the file."
            exit 1
          fi
          dotnet restore "${project}" --locked-mode

      - name: Say which lines this run packages
        # Both lines the manifest set declares, each from its own manifest. The packager
        # stamps the archive with the top level targetAbi of whatever manifest stands at
        # build.yaml, so a line is packaged by putting its manifest there and not by
        # passing a framework, and this step is where the pairs are read and printed
        # before either call. A manifest missing here is a refusal rather than a run that
        # quietly packages one line.
        run: |
          set -euo pipefail
          for manifest in build.yaml build-jf12.yaml; do
            if [ ! -f "${manifest}" ]; then
              echo "::error::${manifest} is not in this checkout, so the line it declares has no manifest to package from."
              exit 1
            fi
            framework="$(sed -n 's/^framework:[[:space:]]*"\([^"]*\)".*/\1/p' "${manifest}")"
            abi="$(sed -n 's/^targetAbi:[[:space:]]*"\([^"]*\)".*/\1/p' "${manifest}")"
            if [ -z "${framework}" ] || [ -z "${abi}" ]; then
              echo "::error::${manifest} declares no top level framework and targetAbi pair, so this run cannot say which line it would package from it."
              exit 1
            fi
            echo "::notice::This run packages ${framework} for ABI ${abi}, the pair ${manifest} names at its top level."
          done

      - name: Build the plugin package for the line build.yaml names
        id: jprm
        # The packager the release route calls, at the same commit, with the framework
        # build.yaml names at its top level. The release route hands the packager the
        # framework its gate derived from the tag, which for a tag with no line segment
        # is this same value. PackagingGateTests holds the pin and holds every call to
        # the framework of the manifest standing at build.yaml when it runs.
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          dotnet-target: "net9.0"

      - name: Refuse an archive carrying anything but the plugin's own files
        env:
          ARTIFACT: ${{ steps.jprm.outputs.artifact }}
        # The packager copies what build.yaml lists and writes meta.json beside it, and
        # nothing so far has read a byte of what ended up inside the zip. A test
        # assembly or a stray file from the output directory shipped in a plugin
        # archive is loaded onto somebody's server, and the first anybody hears of it
        # is a server behaving differently from the one it was tested on. The checker
        # lists every entry, refuses each one that is not an artifact build.yaml
        # declares, meta.json or the declared image, by name, and refuses an archive
        # that does not carry every declared artifact, so an empty or wrong-shaped
        # archive fails rather than passing a refusal that found nothing to refuse.
        # ArchiveEntriesGateTests holds this step to both packaging routes and to every
        # packager call on this one.
        run: |
          set -euo pipefail
          python3 .github/check-archive-entries.py --archive "${ARTIFACT}" --manifest build.yaml

      - name: Write the component inventory for the line build.yaml names
        # CycloneDX is a NuGet global tool, so it is pinned by version, which is
        # the pin a NuGet package has. It reads the restore above rather than
        # fetching its own, so the inventory describes the locked closure and no
        # package can be pulled in merely to describe the bill of materials.
        #
        # One inventory per archive rather than one per run, written under its own line's
        # directory so a reader holding one package has a file that is about that package
        # rather than one shared between two.
        #
        # WHAT THE FRAMEWORK ARGUMENT DOES NOT DO, MEASURED RATHER THAN ASSUMED. The tool
        # declares `--framework` as the target to use and says every target is aggregated
        # when it is told none. It does not narrow the closure here: the restore is already
        # on disk and `--disable-package-restore` is set, so it reads an assets file that
        # carries every declared target, and a run per line produces the same sixty seven
        # components with both lines' server packages in each. So the two inventories are
        # per archive by placement and name and are the same set of components, and each
        # describes what the project declares rather than what its own line resolves. That
        # is the safe direction, because it lists more than the archive carries and never
        # less, and it is the bound the single inventory already had. What would narrow it
        # is a restore per target that the tool then reads, which is not what this does.
        env:
          INVENTORY_DIRECTORY: inventory/net9.0
        run: |
          set -euo pipefail
          mkdir -p "${INVENTORY_DIRECTORY}"
          dotnet tool install --global CycloneDX --version 6.2.0
          export PATH="${HOME}/.dotnet/tools:${PATH}"
          dotnet-CycloneDX "Jellyfin.Plugin.WatchSync/Jellyfin.Plugin.WatchSync.csproj" \
            --framework net9.0 \
            --output-format Json \
            --output "${INVENTORY_DIRECTORY}" \
            --filename components.cdx.json \
            --set-nuget-purl \
            --exclude-test-projects \
            --disable-package-restore

      - name: Put the first line's package where the second call cannot overwrite it
        env:
          ARTIFACT: ${{ steps.jprm.outputs.artifact }}
        # The two manifests agree on the plugin's name and version, which ReleaseLineTests
        # refuses them disagreeing on, so the packager names both archives identically and
        # the second call would write over the first in the same output directory. The
        # archive is moved under its own line before the second call rather than after it,
        # because a run that packaged the second line over the first would report two
        # packages and hold one.
        run: |
          set -euo pipefail
          mkdir -p packages/net9.0
          mv "${ARTIFACT}" "${ARTIFACT}.meta.json" packages/net9.0/
          ls -l packages/net9.0

      - name: Put the second line's manifest where the packager reads it
        env:
          MANIFEST: build-jf12.yaml
          EXPECTED_FRAMEWORK: net10.0
        # The packager takes no manifest argument. It discovers one inside the path by
        # name, and build.yaml is that name, so the second line's manifest reaches it only
        # by being build.yaml at the moment it runs. This is the same swap the release
        # route makes for a tagged line, and its silent failure is the same: a 12.0 archive
        # stamped with the 10.11 ABI, which installs on a server it cannot run on. So it is
        # read back rather than trusted, byte for byte and on the framework it declares.
        run: |
          set -euo pipefail
          if [ ! -f "${MANIFEST}" ]; then
            echo "::error::${MANIFEST} is not in this checkout, so the second line has no manifest to package from."
            exit 1
          fi
          rm build.yaml
          cp "${MANIFEST}" build.yaml
          if ! cmp -s build.yaml "${MANIFEST}"; then
            echo "::error::build.yaml is not ${MANIFEST} after the swap, so the packager would read a manifest of a line other than the second one."
            exit 1
          fi
          declared="$(sed -n 's/^framework:[[:space:]]*"\([^"]*\)".*/\1/p' build.yaml)"
          if [ "${declared}" != "${EXPECTED_FRAMEWORK}" ]; then
            echo "::error::build.yaml declares the framework '${declared}' after the swap and this call packages ${EXPECTED_FRAMEWORK}, so the manifest in front of the packager is not the second line's."
            exit 1
          fi
          echo "Packaging ${EXPECTED_FRAMEWORK} from ${MANIFEST}, standing at build.yaml."

      - name: Build the plugin package for the second line
        id: jprm-second
        # The same packager at the same commit, over the manifest the step above put at
        # build.yaml. The framework here and the framework that manifest declares are one
        # value, and PackagingGateTests refuses them being two.
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          dotnet-target: "net10.0"

      - name: Refuse an archive carrying anything but the plugin's own files
        env:
          ARTIFACT: ${{ steps.jprm-second.outputs.artifact }}
        # The second line's archive, read against the manifest that produced it, which is
        # the one now standing at build.yaml. A check that ran on one archive and not the
        # other would leave half of what this run publishes unread.
        run: |
          set -euo pipefail
          python3 .github/check-archive-entries.py --archive "${ARTIFACT}" --manifest build.yaml

      - name: Write the component inventory for the second line
        # The second archive's inventory, written under its own directory. What the
        # framework argument does and does not do is measured at the step above and is not
        # restated here.
        env:
          INVENTORY_DIRECTORY: inventory/net10.0
        run: |
          set -euo pipefail
          mkdir -p "${INVENTORY_DIRECTORY}"
          export PATH="${HOME}/.dotnet/tools:${PATH}"
          dotnet-CycloneDX "Jellyfin.Plugin.WatchSync/Jellyfin.Plugin.WatchSync.csproj" \
            --framework net10.0 \
            --output-format Json \
            --output "${INVENTORY_DIRECTORY}" \
            --filename components.cdx.json \
            --set-nuget-purl \
            --exclude-test-projects \
            --disable-package-restore

      - name: Put the second line's package beside the first
        env:
          ARTIFACT: ${{ steps.jprm-second.outputs.artifact }}
        run: |
          set -euo pipefail
          mkdir -p packages/net10.0
          mv "${ARTIFACT}" "${ARTIFACT}.meta.json" packages/net10.0/
          ls -l packages/net10.0

      - name: Prove the archive check refuses what it is written for
        # The steps above are green on every archive the packager has produced here,
        # which is every archive that ever carried only the plugin, so on their own they
        # say nothing about whether they can refuse. Five archives built in the run
        # against the fixture manifest beside the checker, each arm named, with the
        # one that has to pass run last.
        run: |
          set -euo pipefail
          checker=.github/check-archive-entries.py
          manifest=.github/archive-fixtures/manifest.yaml
          work="${RUNNER_TEMP}/archive-proof"
          rm -rf "${work}"
          mkdir -p "${work}/tree/lib" "${work}/tree/runtimes"
          : > "${work}/tree/Plugin.dll"
          : > "${work}/tree/lib/Plugin.Helper.dll"
          : > "${work}/tree/meta.json"
          : > "${work}/tree/Plugin.Tests.dll"
          archive() {
            local name="$1"
            shift
            (cd "${work}/tree" && python3 -m zipfile -c "${work}/${name}.zip" "$@")
          }
          archive the-plugins-own-files Plugin.dll lib meta.json
          archive a-test-assembly-inside Plugin.dll lib meta.json Plugin.Tests.dll
          archive no-plugin-assembly lib meta.json
          archive a-folder-that-is-nobodys Plugin.dll lib meta.json runtimes
          archive an-empty-archive
          refuses() {
            if python3 "${checker}" --archive "${work}/$1.zip" --manifest "${manifest}" > /dev/null 2>&1; then
              echo "::error::${checker} passed $1.zip against $(basename "${manifest}"), and that archive exists to be refused. The guard is not biting."
              exit 1
            fi
          }
          refuses a-test-assembly-inside
          refuses no-plugin-assembly
          refuses a-folder-that-is-nobodys
          refuses an-empty-archive
          python3 "${checker}" --archive "${work}/the-plugins-own-files.zip" --manifest "${manifest}"
          echo "The archive check refused all four of its arms and passed the plugin's own files."

      - name: Check the run produced a package and an inventory for every line
        # if-no-files-found on the upload below fires only when no pattern
        # matches at all, so a missing inventory would ride through as a warning
        # and leave the run looking like one that produced both. Named here, one
        # line at a time, and the archive is asked for by shape rather than by name
        # because the name is the packager's to choose.
        run: |
          set -euo pipefail
          shopt -s nullglob
          for framework in net9.0 net10.0; do
            zips=("packages/${framework}"/*.zip)
            if [ "${#zips[@]}" -ne 1 ]; then
              echo "::error::This run collected ${#zips[@]} archives for ${framework}. One line packages to one archive, and a run that holds none or two has not packaged that line."
              exit 1
            fi
            for file in "${zips[0]}" "${zips[0]}.meta.json" "inventory/${framework}/components.cdx.json"; do
              if [ ! -f "${file}" ]; then
                echo "::error::This run did not produce ${file}. The archive, the metadata written beside it and the component inventory are all outputs of packaging one line."
                exit 1
              fi
            done
            ls -l "${zips[0]}" "${zips[0]}.meta.json" "inventory/${framework}/components.cdx.json"
          done

      - name: Check the licence of every component in every inventory
        # The inventory records what is in the build and never asks what any of
        # it may be distributed under. This does, against the licence this
        # repository itself ships under, which the check reads out of LICENSE
        # rather than carrying an answer to. A component the inventory states no
        # identifier for is declared in .github/component-licences.txt with where
        # its licence was read, and a declaration covering nothing is refused, so
        # a dependency bump takes the reading with it.
        #
        # Both inventories, because the run writes one per archive and a check reading one
        # of two would leave a file it publishes unjudged. The two hold the same components
        # today, which the step that writes them records and which is a fact about the tool
        # rather than a rule: a run whose inventories diverge is one this loop already
        # covers.
        run: |
          set -euo pipefail
          for framework in net9.0 net10.0; do
            echo "Checking the components of ${framework}."
            python3 .github/check-component-licences.py < "inventory/${framework}/components.cdx.json"
          done

      - name: Prove the licence check refuses what it is written for
        # The step above is green on every graph that has never carried a bad
        # licence, which is every graph this repository has had, so on its own it
        # says nothing about whether it can refuse. Five runs over three fixture
        # inventories and two fixture registers, each arm beside its own repair.
        run: |
          set -euo pipefail
          checker=.github/check-component-licences.py
          fixtures=.github/inventory-fixtures
          refuses() {
            if python3 "${checker}" --declarations "$2" < "$1" > /dev/null 2>&1; then
              echo "::error::${checker} passed $(basename "$1") against $(basename "$2"), and that fixture exists to be refused. The guard is not biting."
              exit 1
            fi
          }
          passes() {
            python3 "${checker}" --declarations "$2" < "$1" > /dev/null
          }
          refuses "${fixtures}/an-incompatible-licence.cdx.json" "${fixtures}/nothing-declared.txt"
          passes "${fixtures}/every-licence-permitted.cdx.json" "${fixtures}/nothing-declared.txt"
          refuses "${fixtures}/a-licence-the-inventory-does-not-state.cdx.json" "${fixtures}/nothing-declared.txt"
          passes "${fixtures}/a-licence-the-inventory-does-not-state.cdx.json" "${fixtures}/the-unstated-licence-read.txt"
          refuses "${fixtures}/every-licence-permitted.cdx.json" "${fixtures}/the-unstated-licence-read.txt"
          echo "The licence check refused all three of its arms and passed both repairs."

      - name: Attach every package and its inventory to the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-and-inventories
          retention-days: 30
          if-no-files-found: error
          path: |
            packages/
            inventory/
