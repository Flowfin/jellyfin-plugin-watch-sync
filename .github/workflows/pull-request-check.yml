# Reads the pull request rather than the code.
#
# Whether a pull request names an issue, whether its commits name one, whether a
# version bump carries its changelog entry and whether a change that drops
# support for something carries one are questions no other check here can
# answer, because none of the others sees the pull request at all. The compiler and the analyzers read the code, the sign-off gate reads
# a trailer, the workflow audit reads these files, and the unicode guard reads
# bytes. This is the class none of them cover.
#
# The reading and the verdict are two files under .github/, so the same pair can
# be run against a pull request by hand and so the verdict can be proven on a
# document written by hand rather than fetched. This workflow runs them and
# reports the exit code.
#
# Three tiers, and the separation is the point. A blocking rule is decidable by
# reading text and it fails. Anything needing a judgement warns and can never
# fail, because a gate that blocks on a judgement is one people learn to work
# around. A rule that was considered and did not apply leaves a note, so an
# excused pull request is not one nothing looked at. The last step turns the
# three prefixes into an error, a warning and a notice annotation, which GitHub
# renders differently, so none of the three can be mistaken for another on the
# run page either.
name: Pull request check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - master

# Read-only. The check reads the pull request and writes nothing to it.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    # The ruleset matches the literal check-run name, so this string is the one
    # the parity table already records for this check, and a rename here would
    # remove a check rather than rename one.
    name: Deterministic PR-hygiene checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout, and read the manifest at both ends
      pull-requests: read # title, body, commits and changed files
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The check refuses a near miss, passes its repair, and excuses nothing in silence
        # A checker gutted into a pass is green on every real pull request and
        # says nothing. This step is what turns that into a red run: the near
        # miss is one character away from correct on each blocking rule and has
        # to be refused, and its repair has to pass while still printing the
        # advisory warning it carries on purpose.
        #
        # The version rule can also decline to fire, and a decline has to be
        # proven the same way. Two guards excuse a version change: a repository
        # that has published nothing, and a zero version at either end. Each is
        # the only thing excusing its own document below, so deleting either one
        # refuses that document and reddens this step. Neither can be folded
        # into the pair above, because one document is about one repository and
        # a repository has either published or not.
        run: |
          set -euo pipefail
          if python3 .github/check-pull-request.py < .github/pull-request-near-miss.json; then
            echo "the near miss passed, so the blocking tier is not biting" >&2
            exit 1
          fi
          python3 .github/check-pull-request.py < .github/pull-request-near-miss-repaired.json
          for excused in .github/pull-request-excused-before-any-release.json \
                         .github/pull-request-excused-version-zero.json; do
            if ! verdict="$(python3 .github/check-pull-request.py < "${excused}")"; then
              echo "${verdict}"
              echo "${excused} was refused, so a version nobody could look up still blocks" >&2
              exit 1
            fi
            echo "${verdict}"
            case "${verdict}" in
              *"NOTE a-version-bump-carries-a-changelog-entry"*) ;;
              *)
                echo "${excused} passed without saying why, which is the silence this rule replaced" >&2
                exit 1
                ;;
            esac
          done

      - name: The drop rule refuses each declaration on its own, passes the entry, and declines out loud
        # A change can strand a peer without moving the version, so the rule
        # above sees none of it and this one does. Two near misses rather than
        # one repaired document run against both: a single document tripping
        # both arms would still be refused after either arm was deleted, and
        # the deletion is the mistake this step exists to catch.
        #
        # The other two documents are the directions a refusal is worth less
        # than. One drops the same thing against a repository that has
        # published nothing, which is the state this repository is in today, so
        # what runs on every real pull request here is the decline rather than
        # the refusal and the decline has to be proven. The other reindents the
        # list the rule reads and takes nothing away: an unread declaration
        # answered as an empty set would refuse it, so this asserts it passes
        # and says which end it could not read.
        run: |
          set -euo pipefail
          for dropped in .github/pull-request-dropped-envelope-version-near-miss.json                          .github/pull-request-dropped-server-line-near-miss.json; do
            if verdict="$(python3 .github/check-pull-request.py < "${dropped}")"; then
              echo "${verdict}"
              echo "${dropped} passed, so one arm of the drop rule is not biting" >&2
              exit 1
            fi
            case "${verdict}" in
              *"FAIL dropping-support-carries-a-changelog-entry"*) ;;
              *)
                echo "${verdict}"
                echo "${dropped} was refused by another rule, so this one proves nothing" >&2
                exit 1
                ;;
            esac
          done
          python3 .github/check-pull-request.py < .github/pull-request-dropped-support-repaired.json
          for quiet in .github/pull-request-dropped-support-before-any-release.json:"NOTE dropping-support-carries-a-changelog-entry"                        .github/pull-request-support-declaration-unread.json:"WARN a-support-declaration-is-read-or-nothing-is-concluded"; do
            document="${quiet%%:*}"
            expected="${quiet#*:}"
            if ! verdict="$(python3 .github/check-pull-request.py < "${document}")"; then
              echo "${verdict}"
              echo "${document} was refused, so the rule refuses where it may not" >&2
              exit 1
            fi
            echo "${verdict}"
            case "${verdict}" in
              *"${expected}"*) ;;
              *)
                echo "${document} passed without saying why, which is the silence this replaced" >&2
                exit 1
                ;;
            esac
          done

      - name: The floor rule refuses a raised floor, passes a lowered one, and says what it could not order
        # A line that stays declared while the number under it rises strands
        # every install below that number, and neither rule above sees it: the
        # list loses no member and the manifest version need not move. This step
        # is what keeps that rule from being deleted into a pass.
        #
        # Four documents rather than one, because three of them prove things an
        # exit code cannot. The lowered floor is the direction proof: a rule
        # written over `the ABI moved` refuses it, and nothing else here would
        # notice. The declined one and the unordered one both pass, so what has
        # to be asserted is the line each prints, not the status; deleting
        # either disclosure leaves both exiting zero and this step is where that
        # goes red.
        run: |
          set -euo pipefail
          raised=.github/pull-request-raised-abi-floor-near-miss.json
          if verdict="$(python3 .github/check-pull-request.py < "${raised}")"; then
            echo "${verdict}"
            echo "${raised} passed, so the floor rule is not biting" >&2
            exit 1
          fi
          case "${verdict}" in
            *"FAIL raising-an-abi-floor-carries-a-changelog-entry"*) ;;
            *)
              echo "${verdict}"
              echo "${raised} was refused by another rule, so this one proves nothing" >&2
              exit 1
              ;;
          esac
          python3 .github/check-pull-request.py < .github/pull-request-raised-abi-floor-repaired.json
          for quiet in .github/pull-request-lowered-abi-floor.json:"" \
                       .github/pull-request-raised-abi-floor-before-any-release.json:"NOTE raising-an-abi-floor-carries-a-changelog-entry" \
                       .github/pull-request-abi-floor-not-a-number.json:"WARN an-abi-floor-is-ordered-or-nothing-is-concluded" \
                       .github/pull-request-support-declaration-unread.json:"the ABI floor declaration parses at one end"; do
            document="${quiet%%:*}"
            expected="${quiet#*:}"
            if ! verdict="$(python3 .github/check-pull-request.py < "${document}")"; then
              echo "${verdict}"
              echo "${document} was refused, so the rule refuses where it may not" >&2
              exit 1
            fi
            echo "${verdict}"
            if [ -n "${expected}" ]; then
              case "${verdict}" in
                *"${expected}"*) ;;
                *)
                  echo "${document} passed without saying why, which is the silence this replaced" >&2
                  exit 1
                  ;;
              esac
            fi
          done

      - name: The release notes assembler refuses what it cannot lead with, and leads with what changes existing data
        # The rules above refuse a change that writes no changelog entry. This is the
        # other end of the same format: what the entry is FOR is the notes a release
        # carries, and the assembler that writes them runs once per release, in the
        # publish route, where nothing on a pull request would notice it had been
        # gutted. So it is proven here instead, on fragments written by hand.
        #
        # Four things, and the middle two are the ones an exit code cannot say. The
        # near miss is a change marked as reaching already-synced watch state with the
        # sentence for the operator missing, which is the mistake somebody makes,
        # and it has to be refused for the assembler's own rule. Its repair has to
        # assemble. The ordering pair is the direction proof: the entry that changes
        # existing data carries the HIGHER ordinal, so an assembler that emitted the
        # fragments in file order would pass every other assertion here and put it
        # second, which is the reader's problem this whole marking exists for. And a
        # release with no such entry has to say so rather than leave the section out,
        # because an absent section reads as an oversight and a stated one does not.
        run: |
          set -euo pipefail
          near=.github/release-notes-near-miss/0001-a-conflict-rule-that-moves.md
          if reason="$(python3 .github/assemble-release-notes.py "${near}" 2>&1 >/dev/null)"; then
            echo "${near} assembled, so a marked change can still reach an operator with nothing said about their data" >&2
            exit 1
          fi
          echo "${reason}"
          case "${reason}" in
            *"FAIL change-without-an-effect"*) ;;
            *)
              echo "${near} was refused by something else, so this proves nothing" >&2
              exit 1
              ;;
          esac

          python3 .github/assemble-release-notes.py .github/release-notes-near-miss-repaired/*.md > /dev/null

          notes="$(python3 .github/assemble-release-notes.py .github/release-notes-ordering/*.md)"
          echo "${notes}"
          changed="$(printf '%s\n' "${notes}" | grep -n -x -F '### A conflict rule that moves' | cut -d: -f1)"
          ordinary="$(printf '%s\n' "${notes}" | grep -n -x -F '### An ordinary change' | cut -d: -f1)"
          if [ -z "${changed}" ] || [ -z "${ordinary}" ]; then
            echo "one of the two ordering fixtures did not reach the notes at all" >&2
            exit 1
          fi
          if [ "${changed}" -ge "${ordinary}" ]; then
            echo "the entry that changes already-synced watch state is at line ${changed} and the ordinary one at line ${ordinary}, so the notes do not lead with it" >&2
            exit 1
          fi

          quiet="$(python3 .github/assemble-release-notes.py .github/release-notes-ordering/0001-an-ordinary-change.md)"
          echo "${quiet}"
          case "${quiet}" in
            *"Nothing in this release changes what happens to watch state"*) ;;
            *)
              echo "a release with no entry reaching existing data said nothing about it, which reads as an oversight rather than as an answer" >&2
              exit 1
              ;;
          esac

          python3 .github/assemble-release-notes.py > /dev/null

      - name: Assemble the document this pull request is
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 .github/assemble-pull-request.py "${REPOSITORY}" "${NUMBER}" > document.json

      - name: Every blocking rule holds
        run: |
          set -uo pipefail
          # The default shell for a run block is `bash -e`, and -e is applied
          # whether or not this script asks for it. Under it the line below ends
          # the step the moment the checker refuses, before a single reason is
          # printed, so a refused pull request showed an exit code and nothing
          # else. Turning it off around the one command that is expected to fail
          # is what makes the reasons reach the reader.
          set +e
          python3 .github/check-pull-request.py < document.json > verdict.txt
          status=$?
          set -e
          while IFS= read -r line; do
            case "${line}" in
              "FAIL "*) echo "::error::${line#FAIL }" ;;
              "WARN "*) echo "::warning::${line#WARN }" ;;
              "NOTE "*) echo "::notice::${line#NOTE }" ;;
            esac
          done < verdict.txt
          cat verdict.txt
          exit "${status}"
