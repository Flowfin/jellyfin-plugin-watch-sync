name: '📝 Create/Update Release Draft & Release Bump PR'

on:
  push:
    branches:
      - master
    paths-ignore:
      - build.yaml
  workflow_dispatch:
  repository_dispatch:
    types:
      - update-prep-command

# Deny by default at the workflow level; the job below grants only the scopes
# it needs. The shared workflow this calls declares no permissions of its own,
# so what the caller grants is the whole of what it gets.
permissions: {}

jobs:
  call:
    permissions:
      contents: write # create and update the release draft
      pull-requests: write # open and update the version bump pull request
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/changelog.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master, 2026-07-29
    with:
      repository-name: iderex/jellyfin-plugin-watch-sync
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
