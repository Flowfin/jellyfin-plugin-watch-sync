name: Publish Release

# Pushing a tag is the only way a release is published. CI builds the plugin from the
# tagged commit, creates the GitHub release for that tag and uploads the assets. No
# release is ever created by hand.
#
# The suffix on the tag chooses the channel. `-stable` publishes an ordinary release and
# `-prerelease` publishes one marked as a pre-release, which is what an operator who
# wants to try a version subscribes to at a second manifest address instead of
# repointing a running install. The two suffixes are the whole difference: the same
# build, the same checks and the same assets on both routes.
#
# A trial release that is deleted afterwards is not available here and is not wanted.
# Deleting a release spends its tag permanently, and the pre-release channel does the
# same job without that price, because a pre-release is a real version that stays.
#
# The numeric part of the tag is the plugin version Jellyfin installs. It must equal
# build.yaml's `version`, and the gate job below fails the run if it does not. A version
# is spent once across both channels: the release job refuses a version already
# published under either suffix, because two releases claiming one version with
# different bytes is a catalog offering whichever of them it read last.
#
# What this workflow publishes is one package for the one server line build.yaml names
# in `framework` and `targetAbi`. A repository that ships two server lines needs a
# second manifest and a second route; this file does not provide one, and the checks
# below refuse to guess.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-stable"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+-stable"
      - "[0-9]+.[0-9]+.[0-9]+-prerelease"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+-prerelease"

# Deny by default. Each job opts into the smallest scope it needs.
permissions: {}

# One publish per tag. The group is keyed on the tag rather than on the workflow,
# because two different tags share no state here and GitHub keeps at most one queued
# run per group: a shared group silently drops the middle tag of three pushed in a
# row, and a dropped run ends as cancelled, which sends no failure anywhere.
# cancel-in-progress stays false so a run holding contents:write is never killed
# between creating a release and attaching its assets.
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release metadata gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      # The channel, as the literal the release step needs. Derived from the tag suffix
      # here rather than written into that step, so the two cannot drift into a
      # pre-release tag publishing an ordinary release.
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin the checkout to the commit recorded in the push event. Without this,
          # actions/checkout resolves a tag ref against origin at the moment the job
          # runs, so a tag force-moved while the run is in flight would put a different
          # tree in front of the ancestry check below than the one that gets built.
          # A 40 character hex ref is treated as a commit, not as a ref to resolve.
          ref: ${{ github.sha }}
          # Full history so the ancestry check below can compare the tagged commit
          # against the release branches.
          fetch-depth: 0
          # Nothing here pushes, so do not leave the token in .git/config.
          persist-credentials: false

      - name: Write the manifest reader
        # One reader, in a file, so the parsing rules are stated once. A quoted scalar
        # ends at its closing quote, and an unquoted one ends at a comment or at the end
        # of the line. Trailing whitespace and a CR from a CRLF checkout are removed
        # before either rule is applied, because otherwise the closing quote is no
        # longer the last character on the line and stays in the value.
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/manifest"
          cat > "${RUNNER_TEMP}/manifest/read_scalar.awk" <<'AWK'
          index($0, key ":") == 1 {
            value = substr($0, length(key) + 2)
            sub(/\r$/, "", value)
            sub(/^[[:space:]]+/, "", value)
            sub(/[[:space:]]+$/, "", value)
            if (substr(value, 1, 1) == "\"") {
              value = substr(value, 2)
              end = index(value, "\"")
              if (end > 0) { value = substr(value, 1, end - 1) }
            } else if (substr(value, 1, 1) == "'") {
              value = substr(value, 2)
              end = index(value, "'")
              if (end > 0) { value = substr(value, 1, end - 1) }
            } else {
              sub(/[[:space:]]*#.*$/, "", value)
              sub(/[[:space:]]+$/, "", value)
            }
            print value
            exit
          }
          AWK

      - name: Check the tag and build.yaml agree
        id: metadata
        env:
          # Space separated list of branches a release may be cut from.
          RELEASE_REFS: "master"
          EXPECTED_FRAMEWORK: "net9.0"
        run: |
          set -euo pipefail

          # A workflow_dispatch or a run started from a branch would name the release
          # after the branch and tag a commit nobody released.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow publishes from a tag only, but it was started from ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}."
            exit 1
          fi

          # The checkout above asked for a commit rather than for the tag. Read that
          # back instead of trusting it, so a change to the checkout step that reopens
          # the moved-tag window shows up here rather than in a signed release.
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::error::The working tree is at ${head}, but the push event recorded ${GITHUB_SHA}. The tag was moved after the run started, or the checkout step no longer pins the commit."
            exit 1
          fi

          # The suffix chooses the channel and nothing else does. Every pattern the
          # trigger above accepts needs an arm here: a pattern with no arm reaches this
          # case, falls to the catch-all and stops the run, which is safe but arrives
          # after the tag has been pushed. ReleaseChannelTests holds the two lists to
          # each other so that mismatch is a red suite instead.
          tag="${GITHUB_REF_NAME}"
          case "${tag}" in
            *-stable) numeric="${tag%-stable}" ; prerelease=false ;;
            *-prerelease) numeric="${tag%-prerelease}" ; prerelease=true ;;
            *)
              echo "::error::Tag ${tag} does not end in -stable or -prerelease."
              exit 1
              ;;
          esac

          if [ ! -f build.yaml ]; then
            echo "::error::build.yaml is missing from the repository root. The packaging step reads all plugin metadata from it."
            exit 1
          fi

          # The packaging tool takes the first of several file names it recognises, and
          # build.yaml is last in that list. A leftover jprm.yaml or meta.yaml would be
          # packaged instead of the file every check here reads.
          shadow=0
          for other in jprm.yaml .jprm.yaml .ci/jprm.yaml .github/jprm.yaml .gitlab/jprm.yaml meta.yaml; do
            if [ -f "${other}" ]; then
              echo "::error::${other} exists. The packaging tool reads it in preference to build.yaml, so the package would carry metadata nothing in this workflow checked. Remove it or fold it into build.yaml."
              shadow=1
            fi
          done
          if [ "${shadow}" -ne 0 ]; then
            exit 1
          fi

          read_scalar() {
            awk -v key="$1" -f "${RUNNER_TEMP}/manifest/read_scalar.awk" build.yaml
          }

          # changelog is in this list because the packaging tool reads build_cfg
          # ['changelog'] without a default and dies with a Python KeyError when it is
          # absent. That happens after the plugin has already been compiled, which is
          # far past the point where the tag is spent.
          missing=0
          for key in name guid version targetAbi framework owner overview description category artifacts changelog; do
            if ! grep -Eq "^${key}:" build.yaml; then
              echo "::error::build.yaml has no top level '${key}' field. A catalog entry built from this package would be incomplete."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

          # `image` names a file that is copied into the archive. The packaging tool
          # exits on a missing one, again after the build.
          if grep -Eq "^image:" build.yaml; then
            image="$(read_scalar image)"
            if [ ! -f "${image}" ]; then
              echo "::error::build.yaml declares image '${image}', which is not in the repository. The packaging step copies that file into the archive and fails without it."
              exit 1
            fi
          fi

          version="$(read_scalar version)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::build.yaml version '${version}' is not three or four numeric parts (X.Y.Z or X.Y.Z.W)."
            exit 1
          fi

          if [ "${version}" != "${numeric}" ]; then
            echo "::error::Tag ${tag} carries version ${numeric} but build.yaml declares ${version}. Bump build.yaml, or tag the version that is in it."
            exit 1
          fi

          abi="$(read_scalar targetAbi)"
          if [[ ! "${abi}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::build.yaml targetAbi '${abi}' is not four numeric parts (A.B.C.D). Jellyfin compares this value to decide whether to offer the plugin at all."
            exit 1
          fi

          framework="$(read_scalar framework)"
          if [ "${framework}" != "${EXPECTED_FRAMEWORK}" ]; then
            echo "::error::build.yaml framework '${framework}' does not match the target this workflow builds (${EXPECTED_FRAMEWORK}). Either the manifest names a runtime the project is not compiled for, or the workflow was filled in for a different server line."
            exit 1
          fi

          guid="$(read_scalar guid)"
          if [[ ! "${guid}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::build.yaml guid '${guid}' is not a UUID. It must be the plugin's own, permanent id."
            exit 1
          fi

          # A tag can be pushed onto any commit, including one that was never merged.
          # Require the tagged commit to be contained in a release branch.
          reachable=0
          for branch in ${RELEASE_REFS}; do
            if git rev-parse --verify --quiet "refs/remotes/origin/${branch}" >/dev/null; then
              if git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${branch}"; then
                reachable=1
                break
              fi
            else
              echo "::warning::There is no branch named '${branch}' on origin, so it cannot contain anything. Check the release branch list this workflow was filled in with."
            fi
          done
          if [ "${reachable}" -ne 1 ]; then
            echo "::error::Commit ${GITHUB_SHA} is not contained in any of the release branches (${RELEASE_REFS}), so it must not be published."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${version} from tag ${tag}, prerelease=${prerelease}."

      - name: Assemble the release notes from the changelog fragments
        env:
          TAG: ${{ github.ref_name }}
        # The changelog here is a directory of fragments rather than a prose file
        # somebody edits at the end, and this is where a release reads it. The notes
        # are assembled in this job because it is the one with the checkout: the
        # release job checks nothing out and handles only the bytes the build
        # produced. Failing here costs nothing published, because no release exists
        # until three jobs later.
        #
        # Which fragments belong to this release is derived rather than remembered.
        # An earlier release tag contained in this commit bounds the set, so an entry
        # that already went out in an earlier release is not repeated; with no such
        # tag every fragment is taken, which is the first release. Neither case asks
        # anybody to delete a file after a release, because a step nothing enforces
        # is one that gets skipped and then the notes repeat every entry ever
        # written.
        run: |
          set -euo pipefail
          previous="$(git tag --list '*-stable' '*-prerelease' --merged HEAD --sort=-creatordate \
            | grep -v -x -F -- "${TAG}" | head -n 1 || true)"
          if [ -n "${previous}" ]; then
            echo "::notice::These notes carry the changelog fragments written since ${previous}."
            mapfile -t fragments < <(git diff --name-only --diff-filter=AMR "${previous}" HEAD -- changelog.d/)
          else
            echo "::notice::No earlier release tag is contained in this commit, so these notes carry every fragment under changelog.d/."
            mapfile -t fragments < <(git ls-files -- changelog.d/)
          fi
          if [ "${#fragments[@]}" -eq 0 ]; then
            echo "::error::No changelog fragment belongs to this release, so it would be published with nothing written for the operator deciding whether to take it. Write one under changelog.d/ and tag again."
            exit 1
          fi
          printf 'Assembling from:\n'
          printf '  %s\n' "${fragments[@]}"
          mkdir -p "${RUNNER_TEMP}/notes"
          python3 .github/assemble-release-notes.py "${fragments[@]}" > "${RUNNER_TEMP}/notes/release-notes.md"
          echo '--- the notes this release will carry ---'
          cat "${RUNNER_TEMP}/notes/release-notes.md"

      - name: Hand the release notes to the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/notes/release-notes.md

  build:
    name: Build package
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reads the source and nothing else. The signing scopes are deliberately not here:
    # this job runs a NuGet restore and arbitrary MSBuild logic from every restored
    # package, and a job that can be made to run someone else's code must not also be
    # able to mint an attestation under this repository's identity.
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The same commit the gate job checked, for the same reason.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up .NET
        # No dependency cache in the publish path. A cache entry written by another
        # run must never be able to reach the bytes that get released.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Check the project is built for the target in the manifest
        env:
          EXPECTED_FRAMEWORK: "net9.0"
        # Asked of MSBuild rather than read out of the project file, because the target
        # frameworks are often set in Directory.Build.props or behind a property. The
        # packaging step runs `dotnet publish -f <target>`, and a target the project
        # does not declare fails there with NETSDK1005, after the gate has passed.
        run: |
          set -euo pipefail
          singular="$(dotnet msbuild "Jellyfin.Plugin.WatchSync/Jellyfin.Plugin.WatchSync.csproj" -getProperty:TargetFramework -nologo | tr -d '[:space:]')"
          plural="$(dotnet msbuild "Jellyfin.Plugin.WatchSync/Jellyfin.Plugin.WatchSync.csproj" -getProperty:TargetFrameworks -nologo | tr -d '[:space:]')"
          declared="${plural:-${singular}}"
          if [ -z "${declared}" ]; then
            echo "::error::Jellyfin.Plugin.WatchSync/Jellyfin.Plugin.WatchSync.csproj declares neither TargetFramework nor TargetFrameworks."
            exit 1
          fi
          found=0
          IFS=';' read -ra frameworks <<< "${declared}"
          for tfm in "${frameworks[@]}"; do
            if [ "${tfm}" = "${EXPECTED_FRAMEWORK}" ]; then
              found=1
            fi
          done
          if [ "${found}" -ne 1 ]; then
            echo "::error::Jellyfin.Plugin.WatchSync/Jellyfin.Plugin.WatchSync.csproj is built for '${declared}', which does not include ${EXPECTED_FRAMEWORK}. build.yaml and the project disagree about which server line this is. Bring them into line before tagging."
            exit 1
          fi
          if [ "${#frameworks[@]}" -gt 1 ]; then
            echo "::notice::The project is built for ${declared}. This run publishes only ${EXPECTED_FRAMEWORK}, the line build.yaml names. The other lines are not published by this workflow."
          fi

      - name: Restore against the committed lock file
        # The packaging tool calls dotnet itself and passes no restore arguments, so
        # without this step the graph the release is compiled from is whatever the feed
        # served at that minute. Locked mode refuses a graph that does not match
        # packages.lock.json, which is the file review actually saw.
        #
        # A repository with no lock file fails here rather than building. Creating one
        # is a single command and is written up in docs/RELEASING.md.
        run: |
          set -euo pipefail
          project="Jellyfin.Plugin.WatchSync/Jellyfin.Plugin.WatchSync.csproj"
          lock="$(dirname "${project}")/packages.lock.json"
          if [ ! -f "${lock}" ]; then
            echo "::error::${lock} does not exist. The release build restores in locked mode so the shipped bytes come from the dependency graph that was reviewed. Run: dotnet restore ${project} -p:RestorePackagesWithLockFile=true, then commit the file."
            exit 1
          fi
          dotnet restore "${project}" --locked-mode

      - name: Check the assembly version matches the manifest
        env:
          MANIFEST_VERSION: ${{ needs.gate.outputs.version }}
          EXPECTED_FRAMEWORK: "net9.0"
        # The gate proved the tag and the manifest agree. Nothing so far has looked at
        # the number that ends up inside the DLL, and a project that sets AssemblyVersion
        # by hand can ship a plugin whose assembly says one thing while the catalog entry
        # says another. A three part number is padded to four on both sides before they
        # are compared, because 1.4.0 and 1.4.0.0 are the same version written twice.
        run: |
          set -euo pipefail
          assembly="$(dotnet msbuild "Jellyfin.Plugin.WatchSync/Jellyfin.Plugin.WatchSync.csproj" \
            -getProperty:AssemblyVersion -nologo \
            -p:TargetFramework="${EXPECTED_FRAMEWORK}" | tr -d '[:space:]')"
          if [ -z "${assembly}" ]; then
            echo "::error::Jellyfin.Plugin.WatchSync/Jellyfin.Plugin.WatchSync.csproj sets no AssemblyVersion, so the build stamps the SDK default and the shipped DLL will not carry ${MANIFEST_VERSION}."
            exit 1
          fi
          if [[ ! "${assembly}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Jellyfin.Plugin.WatchSync/Jellyfin.Plugin.WatchSync.csproj stamps AssemblyVersion '${assembly}', which is not three or four numeric parts, so it cannot be the manifest version ${MANIFEST_VERSION}."
            exit 1
          fi
          want="${MANIFEST_VERSION}"
          got="${assembly}"
          case "${want}" in *.*.*.*) ;; *) want="${want}.0" ;; esac
          case "${got}" in *.*.*.*) ;; *) got="${got}.0" ;; esac
          if [ "${want}" != "${got}" ]; then
            echo "::error::build.yaml declares version ${MANIFEST_VERSION} but the assembly is stamped ${assembly}. Derive the assembly version from build.yaml so the two cannot drift, or fix whichever one is wrong."
            exit 1
          fi
          echo "Assembly version ${assembly} matches the manifest."

      - name: Build the plugin package
        id: jprm
        # No version input: the packager reads the version from build.yaml, and the
        # gate job has already proven that value equals the tag.
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          dotnet-target: "net9.0"

      - name: Put the manifest beside the package
        id: assets
        env:
          ARTIFACT: ${{ steps.jprm.outputs.artifact }}
        # The manifest is a release asset, and it is copied rather than uploaded from
        # the checkout. The upload below roots the artifact at the deepest directory
        # every path it is given has in common, so one path taken from the workspace
        # root and one from the packager's output directory share only the workspace:
        # the archive would then arrive in the release job one directory down, where
        # its ./*.zip finds nothing and the run stops after the tag is spent. Copying
        # first keeps every path in one directory and the download flat.
        run: |
          set -euo pipefail
          directory="$(dirname "${ARTIFACT}")"
          cp build.yaml "${directory}/build.yaml"
          echo "manifest=${directory}/build.yaml" >> "${GITHUB_OUTPUT}"

      - name: Check every release input exists
        env:
          ARTIFACT: ${{ steps.jprm.outputs.artifact }}
          MANIFEST: ${{ steps.assets.outputs.manifest }}
        # if-no-files-found on the upload below fires only when no pattern matches at
        # all, so a missing metadata file would ride through as a warning and leave the
        # release one asset short. Named here, one file at a time.
        run: |
          set -euo pipefail
          for file in "${ARTIFACT}" "${ARTIFACT}.meta.json" "${MANIFEST}"; do
            if [ ! -f "${file}" ]; then
              echo "::error::The packaging step did not produce ${file}. The archive, the metadata written beside it and the manifest the package was built from are all release assets."
              exit 1
            fi
          done
          ls -l "${ARTIFACT}" "${ARTIFACT}.meta.json" "${MANIFEST}"

      - name: Hand the package to the later jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifact
          retention-days: 30
          if-no-files-found: error
          # The archive, the metadata the packager writes beside it, and the manifest
          # the package was built from. The metadata and the manifest travel with the
          # release so a catalog entry, and a repair of one, can be written from the
          # package that actually shipped instead of from a file read back out of the
          # tree at a later commit.
          path: |
            ${{ steps.jprm.outputs.artifact }}
            ${{ steps.jprm.outputs.artifact }}.meta.json
            ${{ steps.assets.outputs.manifest }}

  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can mint an attestation under this repository's identity, and
    # it runs no build tooling and checks out nothing. It sees the archive and the
    # OIDC token and nothing else.
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifact

      - name: Attest build provenance
        # Signs a SLSA v1.1 provenance statement for the exact archive this run
        # produced, keyless, using the OIDC token above. Anyone can then check that a
        # downloaded archive came from this repository and this workflow with
        #   gh attestation verify <archive>.zip --repo <owner>/<repository>
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "./*.zip"

  release:
    name: Publish the release
    needs: [gate, build, attest]
    runs-on: ubuntu-latest
    # Generous, because this job builds nothing and the time it spends is asset
    # uploads on somebody else's network. A timeout that fires between creating the
    # release and attaching the last asset leaves exactly the half-published release
    # the concurrency setting above exists to avoid.
    timeout-minutes: 45
    # The only job with write access, and it runs no build tooling.
    permissions:
      contents: write
    steps:
      # No checkout. This job only handles the bytes the build job produced.
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifact

      - name: Download the release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # Into the runner's temporary directory and deliberately not into the working
        # directory: the upload below attaches every file it finds there, and the
        # notes are the body of the release rather than one more asset beside the
        # archive.
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Check the release notes arrived
        env:
          NOTES: ${{ runner.temp }}/notes/release-notes.md
        # Asked for by name rather than left to the release step. An absent body_path
        # is a release published with GitHub's generated list alone, which is the
        # state this route was in before the fragments were read at all, and it would
        # pass in silence.
        run: |
          set -euo pipefail
          if [ ! -s "${NOTES}" ]; then
            echo "::error::The gate job's release notes are not here, so this release would carry no entry written for an operator."
            exit 1
          fi
          cat "${NOTES}"

      - name: Refuse a version that either channel has already published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        # The upload step below replaces an asset of the same name without complaint,
        # so a second run on the same tag would swap the bytes of a version people have
        # already installed and report success. Asked before anything is written, and
        # anything other than a clean 404 stops the run.
        #
        # Both channels are asked, not only this one. The two channels are two manifest
        # addresses over one version number, so 1.4.0-prerelease and 1.4.0-stable are
        # two releases claiming one version, built from two commits, and a catalog that
        # reads one of them offers bytes the other channel's operators never saw. A
        # version is therefore spent by whichever channel published it first, and
        # promoting a pre-release means raising the version rather than retagging it.
        run: |
          set -euo pipefail

          exists() {
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/$1"
          }

          for suffix in stable prerelease; do
            candidate="${VERSION}-${suffix}"
            code="$(exists "${candidate}")"
            case "${code}" in
              404)
                echo "No release exists for ${candidate} yet."
                ;;
              200)
                if [ "${candidate}" = "${GITHUB_REF_NAME}" ]; then
                  echo "::error::A release already exists for ${candidate}. Its assets are what people have installed, so this run will not replace them. Raise the version in build.yaml and push a new tag. docs/RELEASING.md describes the case where the first run left the release incomplete."
                else
                  echo "::error::Version ${VERSION} was already published as ${candidate}, in the other channel. One version is one set of bytes on both channels, so this run will not publish a second ${VERSION}. Raise the version in build.yaml and push a new tag."
                fi
                exit 1
                ;;
              *)
                echo "::error::Asking whether a release exists for ${candidate} returned HTTP ${code}. Not publishing on an unclear answer."
                exit 1
                ;;
            esac
          done

      - name: Write the checksums
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Exactly one archive, therefore exactly one .md5. The MD5 sidecar is the
          # value a Jellyfin catalog serves as the plugin checksum, and a catalog
          # generator that picks a checksum by filename will pick the wrong one the
          # moment a second .md5 exists. Every other asset gets a sha256 instead.
          zips=(./*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one plugin archive, found ${#zips[@]}."
            exit 1
          fi

          metas=(./*.zip.meta.json)
          if [ "${#metas[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one packaging metadata file, found ${#metas[@]}."
            exit 1
          fi

          # The manifest the package was built from. Asked for by name rather than left
          # to the upload above, because a path that stopped matching there is a warning
          # in a job that goes on to publish a release one asset short.
          if [ ! -f ./build.yaml ]; then
            echo "::error::The manifest the package was built from is not among the downloaded files, so the release would carry the archive without it."
            exit 1
          fi

          zip="${zips[0]#./}"
          # The bare filename, so the checksum line names the file a client downloads.
          md5sum "${zip}" > "${zip%.zip}.md5"
          sha256sum "${zip}" > "${zip%.zip}.sha256"
          ls -l

      - name: Create the release and upload the assets
        # Creates the release for the pushed tag and attaches every file in the
        # working directory. fail_on_unmatched_files keeps a run that produced
        # nothing from publishing an empty release. overwrite_files is false because
        # the default is true, and silently replacing a published asset is the one
        # thing this route must never do.
        #
        # prerelease comes from the gate job, which read it off the tag suffix. A
        # literal here is what made this route able to publish one channel only.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.gate.outputs.prerelease }}
          # The changelog fragments this release carries, assembled by the gate job,
          # with the entries that change what happens to already-synced watch state
          # first. `generate_release_notes` stays on beside it and does not replace
          # it: the API documents that a supplied body is pre-pended to the notes it
          # generates, so the operator's entries lead and the merged pull requests
          # follow. The two are written for different readers and the one deciding
          # whether to upgrade reads first.
          body_path: ${{ runner.temp }}/notes/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          preserve_order: true
          files: ./*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
