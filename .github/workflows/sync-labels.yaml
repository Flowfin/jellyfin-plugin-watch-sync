name: '🏷️ Sync labels'

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

# Deny by default at the workflow level; the job below grants only the scopes
# it needs. The shared workflow this calls declares no permissions of its own,
# so what the caller grants is the whole of what it gets.
permissions: {}

jobs:
  call:
    permissions:
      issues: write # labels are issue labels
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/sync-labels.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master, 2026-07-29
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
