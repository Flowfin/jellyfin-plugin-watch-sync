# Allows for the definition of PR and Issue /commands
name: '📟 Slash Command Dispatcher'

on:
  issue_comment:
    types:
      - created

# Deny by default at the workflow level; the job below grants only the scopes
# it needs. The shared workflow this calls declares no permissions of its own,
# so what the caller grants is the whole of what it gets.
permissions: {}

jobs:
  call:
    permissions:
      contents: write # raise the repository_dispatch event the commands run on
      issues: write # add the acknowledging reaction to the comment
      pull-requests: write # the commands are pull-request commands
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/command-dispatch.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master, 2026-07-29
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
