name: '🧪 Test Plugin'

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# Deny by default at the workflow level; the job below grants only the scopes
# it needs. The shared workflow this calls declares no permissions of its own,
# so what the caller grants is the whole of what it gets.
permissions: {}

jobs:
  call:
    permissions:
      # Checkout and restore only.
      contents: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/test.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master, 2026-07-29
