# Runs the suite on Linux, macOS and Windows.
#
# The headless rule says every test this plugin ships runs without a display,
# without elevation, without a machine-wide trust store, without the network,
# without a real wait and without the machine clock. The guard beside that rule
# refuses the calls that would need any of them, by reading the sources. What no
# reading of the sources can show is that the suite actually passes somewhere
# other than the machine it was written on, and that is what this workflow is
# for: a suite that only ever ran on one operating system is a suite whose
# portability is an assumption.
#
# The path separator is the concrete case. The guard shells out to git, takes
# repository-relative paths back, and compares them against paths it built
# itself. On Windows those two come apart unless the code says so, and nothing
# in a Linux run would ever notice.
#
# Elevation is the second thing this workflow is for, and it is where the three
# legs stop being the same job. The Linux and macOS legs refuse a run as uid 0,
# so a green mark on either of them is a green mark from an account that could
# not have opened the machine-wide path or bound the privileged port the rule
# refuses. The hosted Windows image runs its jobs in an elevated account, so the
# same green mark from the Windows leg alone would answer a weaker question: that
# the suite passes on Windows, rather than that it passes on Windows without
# elevation. The last two steps close that gap by creating a standard account on
# the runner and running the suite again as it.
#
# The local time zone is the third thing, and it is the axis a reading of the
# sources reaches least far along. The headless vocabulary refuses the direct
# reads by name, so no test can ask for the machine's zone and none does. What no
# vocabulary refuses is a conversion or a parse that takes the zone implicitly,
# because those are spelled like the calls that do not, and the only way to see
# one is to run the same suite under a zone the machine does not have. Two of the
# legs impose one per process. The Windows leg cannot, for the reason its own
# step gives, so the zone readings are two legs rather than three and the third
# says which of the two questions it answered.
#
# There is deliberately no path filter. A filtered workflow reports no check run
# at all rather than a green one, which the two required workflows already carry
# a note about.
name: Suite on three operating systems

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny by default at the workflow level; the job grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # No leg runs the suite once. The Windows leg runs it twice, from the job's
    # own elevated account and from a standard one that restores its packages
    # from scratch; the other two run it three times, once under the runner's own
    # zone and once under each of the two imposed below. The ceiling covers the
    # longer of those rather than a single run.
    timeout-minutes: 30
    strategy:
      # One operating system failing is the result, not a reason to stop
      # measuring the other two. A cancelled leg leaves no evidence either way.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      # Checkout and restore only.
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in
          # .git/config. The suite reads the checkout through git ls-files,
          # which needs the repository and not the credential.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # One SDK per server line, because the plugin and the suite both build
          # and run once per target. Installing only the newer one leaves the
          # older leg unrunnable, which reads as a suite that was not measured
          # rather than as one that failed.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Refuse a run as root
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # A suite that passes as root proves nothing about a suite that has to
          # pass without elevation: root can open the machine-wide paths and
          # bind the privileged ports the rule refuses, so the failure this run
          # exists to catch would not appear. Fail rather than report a green
          # run that answered a different question.
          id
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::The suite ran as uid 0. A green run as root does not show the suite needs no elevation."
            exit 1
          fi
          echo "Running as uid $(id -u), which is not root."

      - name: Report the Windows privilege state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # This reports and does not refuse, and the difference is deliberate.
          # Whether the hosted Windows image runs its jobs in an elevated
          # account is a property of the image rather than of this repository,
          # and a job cannot drop the privilege it was started with. Refusing
          # here would refuse every Windows run this image can produce. What is
          # printed is the account the ordinary run below used, so a reader can
          # see which of the two Windows runs answered which question.
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [System.Security.Principal.WindowsPrincipal]::new($identity)
          $elevated = $principal.IsInRole([System.Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output "user: $($identity.Name)"
          Write-Output "elevated: $elevated"

      - name: Report the processors this leg measures
        shell: bash
        run: |
          set -euo pipefail
          # The suite runs its collections in parallel and nothing in this
          # repository sets a thread cap, so each run takes the runner's own
          # default and that default is derived from the processors the machine
          # has. The count is therefore part of what a green leg means, and it
          # is the one part the log does not carry: a passed run on a machine
          # with four of them and a passed run on one with thirty-two look
          # identical afterwards, and only the first says anything about a small
          # machine.
          #
          # This reports and refuses nothing. Deleting it turns no leg red,
          # which is the honest description of a line that exists so a reading
          # can quote it rather than assume it.
          if [ -n "${NUMBER_OF_PROCESSORS:-}" ]; then
            processors="${NUMBER_OF_PROCESSORS}"
          else
            processors="$(getconf _NPROCESSORS_ONLN)"
          fi
          echo "logical processors: ${processors}"

      - name: Run the suite
        shell: bash
        run: dotnet test Jellyfin.Plugin.WatchSync.sln --nologo

      - name: Run the suite under two time zones
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          # Neither zone is a whole number of hours from UTC, which is the whole
          # point of choosing them. Asia/Kolkata is half an hour off and never
          # transitions, so it reaches code that assumes an offset is a whole
          # hour. Australia/Lord_Howe is half an hour off and its daylight change
          # is itself half an hour, so it reaches the same assumption inside a
          # transition, which a zone changing by a whole hour would let through.
          #
          # The runtime is asked what it took rather than trusted to have taken
          # it. A process that kept the machine's own zone would pass these runs
          # exactly like one under the requested zone, and the log would read the
          # same either way, which is the one outcome this step must not produce.
          cat > "${RUNNER_TEMP}/zone.cs" <<'CSHARP'
          var requested = Environment.GetEnvironmentVariable("TZ");
          var matched = string.Equals(TimeZoneInfo.Local.Id, requested, StringComparison.Ordinal);
          Console.WriteLine($"requested {requested}, matched {matched}");
          return matched ? 0 : 1;
          CSHARP

          for zone in Asia/Kolkata Australia/Lord_Howe; do
            if ! TZ="${zone}" dotnet run "${RUNNER_TEMP}/zone.cs"; then
              echo "::error::The runtime did not take ${zone} as its local zone, so a suite run under it would report a zone it had not used."
              exit 1
            fi
            TZ="${zone}" dotnet test Jellyfin.Plugin.WatchSync.sln --nologo
          done

      - name: Report that no zone is imposed on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # .NET reads TZ on Linux and macOS. On Windows it takes the local zone
          # from the machine setting and does not read TZ at all, measured
          # against the 10.0.301 SDK with the same file the step above runs:
          #
          #     $env:TZ='Asia/Kolkata'; dotnet run zone.cs
          #     requested Asia/Kolkata, matched False
          #     exit=1
          #
          # So a zone on this leg is a machine-wide write rather than a
          # per-process one, and this workflow makes none. This leg therefore
          # answers that the suite passes on Windows, and not that it passes on
          # Windows under a zone it was not written on. It reports and refuses
          # nothing: deleting it turns no leg red, and what it removes is a
          # reader's ability to see which of the two questions this leg answered.
          Write-Output "No time zone is imposed on this leg. The suite ran under the image's own zone."

      - name: Run the suite as a standard account on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The account lives for the length of this step. Its password is minted
          # here, is never written anywhere the run publishes, and the account is
          # removed by the step below whether this one passed or failed. It joins
          # Users and nothing else: an account in no group at all is not an
          # administrator either, but it cannot log on, and the logon is the whole
          # point of the step.
          $bytes = [byte[]]::new(30)
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $secret = ConvertTo-SecureString -String ([Convert]::ToBase64String($bytes) + 'aA1!') -AsPlainText -Force

          New-LocalUser -Name 'suite' -Password $secret -AccountNeverExpires -PasswordNeverExpires -UserMayNotChangePassword -Description 'Runs the suite without elevation.' | Out-Null
          Add-LocalGroupMember -Group 'Users' -Member 'suite'

          $workspace = $env:GITHUB_WORKSPACE
          $scratch = Join-Path $env:RUNNER_TEMP 'unprivileged'
          New-Item -ItemType Directory -Path $scratch -Force | Out-Null

          # The checkout and one scratch directory are reachable by the account and
          # nothing else is. Read alone is not enough: the suite builds into the
          # checkout, so a read-only grant would fail on the build rather than on
          # anything this run is about.
          icacls $workspace /grant 'suite:(OI)(CI)M' /T /C /Q | Out-Null
          icacls $scratch /grant 'suite:(OI)(CI)M' /T /C /Q | Out-Null

          # The script takes its paths as arguments rather than carrying them as
          # text, so nothing here is quoted into a second language.
          $runner = Join-Path $scratch 'run.ps1'
          @'
          param([string]$Workspace, [string]$Packages, [string]$Dotnet)
          $ErrorActionPreference = 'Stop'
          whoami
          whoami /groups | Select-String 'S-1-16-'
          # git refuses a repository owned by another account unless it is told the
          # ownership is expected. The headless guard shells out to git ls-files, so
          # without this it reads an empty set and the run fails for a reason that
          # has nothing to do with elevation. The statement is made through the
          # environment rather than through git config, because a config write wants
          # a home directory and this account has no reason to acquire one. Both
          # spellings of the path are given: git reports one and the runner set the
          # other, and a comparison that misses is a silent refusal rather than an
          # error.
          $env:GIT_CONFIG_COUNT = '2'
          $env:GIT_CONFIG_KEY_0 = 'safe.directory'
          $env:GIT_CONFIG_VALUE_0 = $Workspace.Replace('\', '/')
          $env:GIT_CONFIG_KEY_1 = 'safe.directory'
          $env:GIT_CONFIG_VALUE_1 = $Workspace
          $env:NUGET_PACKAGES = $Packages
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          Set-Location $Workspace
          & $Dotnet test Jellyfin.Plugin.WatchSync.sln --nologo
          exit $LASTEXITCODE
          '@ | Set-Content -Path $runner -Encoding utf8

          $out = Join-Path $scratch 'stdout.txt'
          $err = Join-Path $scratch 'stderr.txt'
          $credential = [System.Management.Automation.PSCredential]::new('.\suite', $secret)

          # Every value is quoted on the way in. Start-Process joins the list with
          # spaces and quotes nothing, so an unquoted path under Program Files
          # arrives as two arguments and the second one is read as a switch.
          $arguments = @(
            '-NoProfile',
            '-File', ('"' + $runner + '"'),
            '-Workspace', ('"' + $workspace + '"'),
            '-Packages', ('"' + (Join-Path $scratch 'packages') + '"'),
            '-Dotnet', ('"' + (Get-Command dotnet).Source + '"'))

          # The new account gets the environment built for it rather than a copy of
          # this job's. Without this the child runs as the standard account and
          # still points at the elevated account's home and temporary directories,
          # which fails on the first write to either and says nothing about
          # elevation.
          $process = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList $arguments -Credential $credential -WorkingDirectory $scratch -UseNewEnvironment -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err

          Get-Content -Path $out
          $failures = Get-Content -Path $err -Raw
          if ($failures) {
            Write-Output $failures
          }

          if ($process.ExitCode -ne 0) {
            Write-Output "::error::The suite did not pass as a standard account. Exit code $($process.ExitCode)."
            exit $process.ExitCode
          }

      - name: Refuse a leftover under the temporary root
        shell: bash
        run: |
          set -euo pipefail

          # The suite holds one half of #86's third condition by reading its own
          # sources: a case that takes a directory under the temporary root
          # outside the one type that removes it is refused, and that holds on
          # every route the suite runs on including a clone running dotnet test
          # by hand. What no reading of the sources can show is whether a run
          # actually left something behind, and nothing inside the suite runs
          # after the suite, so this step is the other half. It reads the real
          # root after every run this leg made.
          #
          # The root is asked of the runtime rather than assumed. Which variable
          # it comes from differs per platform, and a step reading the wrong
          # directory finds nothing and reports it as nothing left, which is the
          # one outcome a check like this must not produce. The reading is the
          # same call the suite composes its directories from.
          #
          # The match is this suite's own prefix. A step refusing every entry
          # under a root the whole machine shares would fail on the runner
          # image's own files and be turned off within a week.
          #
          # What it does not see: the Windows run above starts a standard
          # account with an environment of its own, so that account's temporary
          # root is not this one and a leftover there is out of reach here. The
          # second-filesystem case writes outside the temporary root by
          # definition and is out of reach for the same reason.
          cat > "${RUNNER_TEMP}/leftovers.cs" <<'CSHARP'
          var root = Path.GetTempPath();
          Console.WriteLine($"temporary root: {root}");
          var left = Directory.EnumerateFileSystemEntries(root, "watchsync-*").ToArray();
          foreach (var entry in left)
          {
              Console.WriteLine(entry);
          }

          return left.Length == 0 ? 0 : 1;
          CSHARP

          if ! dotnet run "${RUNNER_TEMP}/leftovers.cs"; then
            echo "::error::The suite left the entries above under the temporary root. Every directory a case takes is removed when the case is done with it, on the failing path as well as the passing one."
            exit 1
          fi

          echo "Nothing carrying this suite's prefix is left under the temporary root."

      - name: Remove the standard account
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          # The runner is discarded after the job, so this is tidiness rather than
          # a control. It runs on a failed run too, because a step that only tidies
          # up after success is the one that leaves the mess worth finding.
          if (Get-LocalUser -Name 'suite' -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name 'suite'
            Write-Output 'Removed the standard account.'
          }
